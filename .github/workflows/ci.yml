name: CI

# H3-02：PR 目标分支是 develop（AGENTS.md §五），原先只盯 main 导致所有 PR 都不触发 CI。
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run check-types

      - name: Lint
        run: bun run lint

      - name: i18n dead-key & parity check
        run: cd apps/app && bun run check:i18n

      - name: Architecture boundaries & file-size guards
        run: bun run check:arch

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build
