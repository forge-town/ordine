name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ordine
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ordine"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ordine
      PLAYWRIGHT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ordine_playwright
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Create test databases
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -c 'CREATE DATABASE ordine_create_test'
          psql -h localhost -U postgres -d postgres -c 'CREATE DATABASE ordine_db_schema_test'
          psql -h localhost -U postgres -d postgres -c 'CREATE DATABASE ordine_models_test'
          psql -h localhost -U postgres -d postgres -c 'CREATE DATABASE ordine_playwright'

      - name: Format check (changed files)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_SHA:-}" ] || [[ "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="$(git rev-list --max-parents=0 HEAD | tail -n 1)"
          fi

          mapfile -t format_files < <(
            git diff --name-only --diff-filter=ACMR "$BASE_SHA...$GITHUB_SHA" -- \
              '*.js' '*.jsx' '*.ts' '*.tsx' '*.json' '*.jsonc' '*.md' |
              grep -v '^apps/scripts/src/best-practices/.*/code-snippet\.' || true
          )

          if ((${#format_files[@]} == 0)); then
            echo "No format-supported files changed."
          else
            bunx oxfmt --config packages/oxc-formatter-config/oxfmt.json --check "${format_files[@]}"
          fi

      - name: Type check
        run: bun run check-types

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Install Playwright Chromium
        # 必须在 apps/app 下执行:bunx 在仓库根会下载最新版 playwright,装的浏览器
        # 版本与 @playwright/test@1.58.0 期望的 chromium_headless_shell-1208 不匹配;
        # 在 apps/app 内 bunx 优先解析本地依赖的 CLI,版本始终对齐。
        working-directory: apps/app
        run: bunx playwright install --with-deps chromium

      - name: End-to-end test
        working-directory: apps/app
        run: bun run test:e2e
