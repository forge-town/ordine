[package]
name = "ordine-desktop"
version = "0.0.1"
description = "Ordine Desktop App"
authors = ["Code Forge AI"]
edition = "2021"

[lib]
name = "ordine_desktop_lib"
# Desktop binaries consume the Rust library directly; avoid unnecessary DLL exports on MinGW.
crate-type = ["rlib"]
test = false
doctest = false

[[bin]]
name = "ordine-desktop"
path = "src/main.rs"
test = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
