[package]
name = "ordine-desktop"
version = "0.0.1"
description = "Ordine Desktop App"
authors = ["Code Forge AI"]
edition = "2021"

[lib]
name = "ordine_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
