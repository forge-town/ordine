services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ORDINE_POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ordine
    volumes:
      - ordine-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-test-databases.sql:/docker-entrypoint-initdb.d/init-test-databases.sql:ro
      - ./docker/postgres/ensure-test-databases.sh:/usr/local/bin/ensure-test-databases:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ordine"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ordine-postgres-data:
